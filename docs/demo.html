<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run walkthrough — DeepAgentForecast</title>
<meta name="description" content="Every stage of a real DeepAgentForecast run: deep-research log, research dossier, ontology, knowledge graph, simulated forum, final forecast.">
<link rel="icon" type="image/png" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css?v=20260930a">
</head>
<body>

<nav class="nav">
  <span class="brand"><span class="diamond">◇</span> DeepAgentForecast</span>
  <span class="nav-links">
    <a href="index.html#demos" data-i18n="nav.alldemos">All demos</a>
    <button class="lang-toggle" type="button">中文</button>
    <a class="gh-btn" href="https://github.com/linroger/DeepResearchForecast">GitHub →</a>
  </span>
</nav>

<main class="viewer">
  <div class="viewer-head">
    <a class="back" href="index.html#demos" data-i18n="viewer.back">← back to demos</a>
  </div>

  <div class="viewer-prompt">
    <span class="plabel" data-i18n="viewer.prompt">Prompt</span>
    <span id="prompt-text">…</span>
  </div>

  <div class="viewer-tabs stage-tabs" role="tablist">
    <button data-tab="log" data-i18n="tab.log" type="button">① Deep research</button>
    <button data-tab="dossier" data-i18n="tab.dossier" type="button">② Research dossier</button>
    <button data-tab="ontology" data-i18n="tab.ontology" type="button">③ Ontology</button>
    <button data-tab="graph" data-i18n="tab.graph" type="button">④ Knowledge graph</button>
    <button data-tab="forum" data-i18n="tab.forum" type="button">⑤ Simulated forum</button>
    <button data-tab="report" class="active" data-i18n="tab.report" type="button">⑥ Forecast report</button>
  </div>

  <p id="stage-intro" class="stage-intro"></p>
  <div id="stage-body" class="stage-body"><p class="md-loading">Loading…</p></div>
</main>

<footer class="footer">
  <p><span data-i18n="footer.line">Unedited output of real end-to-end runs</span> · <a href="https://github.com/linroger/DeepResearchForecast">DeepAgentForecast</a> · AGPL-3.0</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/force-graph@1.49.4/dist/force-graph.min.js"></script>
<script src="i18n.js?v=20260930a"></script>
<script>
(function () {
  var RUN_KEYS = { 'us-ai-2030': 'run.ai.title', 'ev-2035': 'run.ev.title', 'russia-ukraine': 'run.ru.title', 'semiconductors-2030': 'run.semi.title', 'memory-semi-2030': 'run.mem.title', 'china-storage-2035': 'run.ess.title', 'us-iran-2026': 'run.iran.title', 'storage-semi-2028': 'run.storage.title', 'cloud-2030': 'run.cloud.title', 'collision-decade-2031': 'run.collision.title', 'us-midterms-2026': 'run.midterms.title', 'us-trade-2028': 'run.trade.title', 'grid-storage-2040': 'run.grid.title', 'datacenter-2030': 'run.dc.title', 'quantum-2040': 'run.quantum.title' };
  var params = new URLSearchParams(location.search);
  var runKey = params.get('run');
  var body = document.getElementById('stage-body');
  var intro = document.getElementById('stage-intro');

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  if (!Object.prototype.hasOwnProperty.call(RUN_KEYS, runKey)) {
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('prompt-text').textContent = '—';
      body.innerHTML = '<p class="md-loading">' + esc(drfT('viewer.unknown')) +
        ' <a href="index.html#demos">' + esc(drfT('viewer.backlist')) + '</a></p>';
    });
    return;
  }

  var BASE = 'demos/' + runKey + '/';
  var cache = {};        // url -> parsed payload
  var rendered = {};     // tab -> rendered HTML (graph excluded: re-mounted live)
  var currentTab = 'report';
  var graphInstance = null;

  function fetchText(name) {
    var url = BASE + name;
    if (cache[url]) return Promise.resolve(cache[url]);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status + ' (' + name + ')');
      return r.text();
    }).then(function (t) { cache[url] = t; return t; });
  }
  function fetchJSON(name) {
    return fetchText(name).then(function (t) { return JSON.parse(t); });
  }
  // optional artifact: resolve null instead of rejecting (e.g. actors.json on older runs)
  function fetchJSONOptional(name) {
    return fetchJSON(name).catch(function () { return null; });
  }

  // Language versions of the report / dossier: meta.json maps each language to its
  // file ({"en": "report.md", "zh": "report.zh.md"}); older runs have one language.
  // A version follows the site language unless the reader picks one in the tab.
  var docLang = {};  // 'report' | 'dossier' -> language picked in the tab
  function pickDoc(meta, kind, primaryFile) {
    var map = meta && meta[kind + '_languages'];
    var files = {}, codes = [], primary = null;
    ['en', 'zh'].forEach(function (code) {
      if (map && typeof map[code] === 'string' && /^[a-z]+(?:\.[a-z]+)?\.md$/.test(map[code])) {
        files[code] = map[code];
        codes.push(code);
        if (map[code] === primaryFile) primary = code;
      }
    });
    if (codes.length < 2) return { file: primaryFile, lang: null };
    var want = docLang[kind] || drfLang();
    var lang = files[want] ? want : (primary || codes[0]);
    return { file: files[lang], lang: lang, codes: codes, primary: primary };
  }
  function docLangBar(kind, pick) {
    if (!pick.lang) return '';
    var label = drfT('doclang.' + kind);
    var html = '<div class="doc-lang" role="group" aria-label="' + esc(label) + '">' +
      '<span class="doc-lang-label">' + esc(label) + '</span><span class="forum-switch">';
    pick.codes.forEach(function (code) {
      var on = code === pick.lang;
      html += '<button type="button" data-doc-kind="' + kind + '" data-doc-lang="' + code + '"' +
        ' class="' + (on ? 'active' : '') + '" aria-pressed="' + on + '">' +
        (code === 'zh' ? '中文' : 'English') + '</button>';
    });
    var note = pick.primary && pick.lang !== pick.primary
      ? drfT('doclang.translated.' + pick.primary) : drfT('doclang.original');
    return html + '</span><span class="doc-lang-note">' + esc(note) + '</span></div>';
  }
  function mdBody(pick, md) {
    var lang = pick.lang === 'zh' ? ' lang="zh-CN"' : (pick.lang === 'en' ? ' lang="en"' : '');
    return '<div class="md-body"' + lang + '>' + marked.parse(md) + '</div>';
  }
  function bindDocLang() {
    var btns = body.querySelectorAll('[data-doc-lang]');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        var kind = this.getAttribute('data-doc-kind');
        docLang[kind] = this.getAttribute('data-doc-lang');
        delete rendered[kind];
        show(currentTab);
      });
    }
  }

  function setLoading() { body.innerHTML = '<p class="md-loading">' + esc(drfT('viewer.loading')) + '</p>'; }
  function setError(e) { body.innerHTML = '<p class="md-loading">' + esc(drfT('viewer.loadfail')) + ' ' + esc(e.message) + '</p>'; }

  /* ——— per-stage renderers (return a Promise of HTML string) ——— */

  function renderLog() {
    return Promise.all([fetchText('research_log.txt'), fetchJSON('meta.json')]).then(function (res) {
      var txt = res[0], meta = res[1] || {}, stats = meta.research_log || {};
      var fallbackCount = txt ? txt.replace(/\r?\n$/, '').split(/\r?\n/).length : 0;
      var lineCount = Number.isFinite(stats.line_count) ? stats.line_count : fallbackCount;
      var sourceCount = Number.isFinite(stats.source_count) ? stats.source_count : 0;
      var prompt = meta.prompt || '—';
      var historyLabel = stats.complete === true ? drfT('log.history') : drfT('log.historyPartial');
      return '<div class="research-origin"><span>' + esc(drfT('log.prompt')) + '</span><p>' + esc(prompt) + '</p></div>' +
        '<div class="log-provenance"><strong>' + esc(historyLabel) + '</strong><span>' +
        lineCount + ' ' + esc(drfT('log.lines')) + (sourceCount ? ' · ' + sourceCount + ' ' + esc(drfT('log.sources')) : '') +
        (stats.complete === true ? ' · ' + esc(drfT('log.complete')) : '') + '</span></div>' +
        '<pre class="console-log">' + esc(txt) + '</pre>';
    });
  }

  function renderDossier() {
    return fetchJSONOptional('meta.json').then(function (meta) {
      var pick = pickDoc(meta, 'dossier', 'dossier.md');
      return Promise.all([fetchText(pick.file), fetchJSONOptional('actors.json'), fetchJSONOptional('sources.json'), pick]);
    }).then(function (res) {
      var md = res[0], actors = res[1], sources = res[2], pick = res[3];
      var html = docLangBar('dossier', pick);
      var rows = actors && actors.actors;
      if (Array.isArray(rows) && rows.length) {
        html += '<h2 class="block-h">' + esc(drfT('dossier.actors')) + '</h2>' +
                '<p class="block-sub">' + esc(drfT('dossier.actorsub')) + '</p><div class="actor-grid">';
        rows.forEach(function (a) {
          if (!a || !a.name) return;
          html += '<div class="actor-card"><div class="actor-top"><strong>' + esc(a.name) + '</strong>' +
            '<span class="actor-type">' + esc(a.type || '') + '</span></div>' +
            (a.role ? '<p><span class="alabel">' + esc(drfT('actor.role')) + '</span> ' + esc(a.role) + '</p>' : '') +
            (a.stance ? '<p><span class="alabel">' + esc(drfT('actor.stance')) + '</span> ' + esc(a.stance) + '</p>' : '') +
            (a.influence ? '<span class="actor-infl infl-' + esc(String(a.influence).toLowerCase()) + '">' + esc(String(a.influence)) + ' ' + esc(drfT('actor.influence')) + '</span>' : '') +
            '</div>';
        });
        html += '</div>';
      } else {
        html += '<p class="block-sub">' + esc(drfT('dossier.noactors')) + '</p>';
      }
      html += '<h2 class="block-h">' + esc(drfT('dossier.brief')) + '</h2>' + mdBody(pick, md);
      var srcs = sources && (sources.sources || sources);
      if (Array.isArray(srcs) && srcs.length) {
        html += '<h2 class="block-h">' + esc(drfT('dossier.sources')) + '</h2><ol class="source-list">';
        srcs.forEach(function (s) {
          if (!s) return;
          var url = s.url || '', title = s.title || url;
          if (!url) return;
          html += '<li><a href="' + esc(url) + '" rel="nofollow noopener" target="_blank">' + esc(title) + '</a></li>';
        });
        html += '</ol>';
      }
      return html;
    });
  }

  function renderOntology() {
    return fetchJSON('ontology.json').then(function (o) {
      var html = '';
      if (o.analysis_summary) {
        html += '<h2 class="block-h">' + esc(drfT('onto.summary')) + '</h2><blockquote class="onto-summary">' + esc(o.analysis_summary) + '</blockquote>';
      }
      html += '<h2 class="block-h">' + esc(drfT('onto.entities')) + ' <span class="count-pill">' + (o.entity_types || []).length + '</span></h2><div class="onto-grid">';
      (o.entity_types || []).forEach(function (t) {
        html += '<div class="onto-card"><div class="onto-name">' + esc(t.name) + '</div><p>' + esc(t.description || '') + '</p>';
        if (Array.isArray(t.attributes) && t.attributes.length) {
          html += '<div class="onto-attrs">' + esc(drfT('onto.attrs')) + ': ' + t.attributes.map(function (a) { return '<code>' + esc(a.name) + '</code>'; }).join(' ') + '</div>';
        }
        if (Array.isArray(t.examples) && t.examples.length) {
          html += '<div class="onto-attrs">' + esc(drfT('onto.examples')) + ' ' + esc(t.examples.slice(0, 5).join(', ')) + '</div>';
        }
        html += '</div>';
      });
      html += '</div><h2 class="block-h">' + esc(drfT('onto.edges')) + ' <span class="count-pill">' + (o.edge_types || []).length + '</span></h2><div class="onto-grid">';
      (o.edge_types || []).forEach(function (t) {
        html += '<div class="onto-card"><div class="onto-name">' + esc(t.name) + '</div><p>' + esc(t.description || '') + '</p>';
        if (Array.isArray(t.source_targets) && t.source_targets.length) {
          html += '<div class="onto-attrs">' + t.source_targets.slice(0, 6).map(function (st) {
            return '<code>' + esc(st.source) + ' → ' + esc(st.target) + '</code>';
          }).join(' ') + '</div>';
        }
        html += '</div>';
      });
      html += '</div>';
      return html;
    });
  }

  var PALETTE = ['#FF4500', '#16a34a', '#2563eb', '#9333ea', '#0891b2', '#ca8a04', '#dc2626', '#4f46e5', '#0d9488', '#be185d'];
  function colorFor(label) {
    var h = 0;
    for (var i = 0; i < label.length; i++) h = (h * 31 + label.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }

  // graph.json -> { nodes, links, graph_id }, or null when it lacks the node/link
  // arrays the canvas needs. Links whose endpoints are not in the node set are
  // dropped (force-graph throws on them).
  function normalizeGraph(g) {
    if (!g || !Array.isArray(g.nodes) || !Array.isArray(g.links)) return null;
    var ids = Object.create(null);
    var nodes = g.nodes.filter(function (n) { return n && n.id != null; });
    if (!nodes.length) return null;
    nodes.forEach(function (n) { ids[n.id] = true; });
    var links = g.links.filter(function (l) { return l && ids[l.source] && ids[l.target]; });
    return { nodes: nodes, links: links, graph_id: g.graph_id };
  }
  function graphUnavailable() {
    return '<p class="md-loading">' + esc(drfT('graph.unavailable')) + '</p>';
  }

  function renderGraphTab() {
    // a missing / unparsable / malformed graph.json degrades to a notice instead of a load error
    return fetchJSON('graph.json').then(normalizeGraph, function () { return null; }).then(function (g) {
      if (!g) return graphUnavailable();
      var html = '<div class="graph-stats">' + g.nodes.length + ' ' + esc(drfT('graph.nodes')) + ' · ' +
        g.links.length + ' ' + esc(drfT('graph.edges')) +
        (String(g.graph_id || '').indexOf('demo_') === 0 ? ' · <span class="graph-note">' + esc(drfT('graph.rebuilt')) + '</span>' : '') +
        '</div><div id="graph-canvas" class="graph-canvas"></div>';
      return html;
    });
  }

  function mountGraph() {
    if (!document.getElementById('graph-canvas')) return; // "graph unavailable" notice rendered instead
    fetchJSON('graph.json').then(function (raw) {
      var g = normalizeGraph(raw);
      var el = document.getElementById('graph-canvas');
      if (!g || !el) return;
      // clone data: force-graph mutates node objects (x/y/vx/vy)
      var data = JSON.parse(JSON.stringify({ nodes: g.nodes, links: g.links }));
      graphInstance = ForceGraph()(el)
        .width(el.clientWidth)
        .height(Math.max(480, Math.min(640, window.innerHeight - 280)))
        .nodeId('id')
        .nodeLabel(function (n) {
          return '<div class="g-tip"><strong>' + esc(n.name) + '</strong>' +
            (n.labels && n.labels.length ? ' <em>' + esc(n.labels.join(', ')) + '</em>' : '') +
            (n.summary ? '<br>' + esc(n.summary) : '') + '</div>';
        })
        .nodeCanvasObject(function (node, ctx, scale) {
          var label = node.labels && node.labels[0] ? node.labels[0] : '';
          var r = 4;
          ctx.beginPath();
          ctx.arc(node.x, node.y, r, 0, 2 * Math.PI);
          ctx.fillStyle = label ? colorFor(label) : '#999';
          ctx.fill();
          if (scale > 1.4) {
            ctx.font = (10 / scale * 1.4) + 'px JetBrains Mono, monospace';
            ctx.fillStyle = '#333';
            ctx.fillText(node.name, node.x + r + 2, node.y + 3);
          }
        })
        .linkColor(function () { return 'rgba(0,0,0,0.18)'; })
        .linkWidth(1)
        .linkLabel(function (l) {
          return '<div class="g-tip"><strong>' + esc(l.name) + '</strong>' + (l.fact ? '<br>' + esc(l.fact) : '') + '</div>';
        })
        .graphData(data);
    }).catch(function () {
      // stats row already rendered; say so in the canvas instead of leaving it blank
      var el = document.getElementById('graph-canvas');
      if (el && !el.firstChild) el.innerHTML = graphUnavailable();
    });
  }

  function renderForum() {
    return fetchJSON('forum.json').then(function (f) {
      var plat = renderForum._plat || 'twitter';
      var rows = (f && Array.isArray(f[plat]) ? f[plat] : []).filter(function (r) { return r && typeof r.type === 'string'; });
      var posts = 0, comments = 0, likes = 0;
      rows.forEach(function (r) {
        if (r.type === 'CREATE_POST') posts++;
        else if (r.type === 'CREATE_COMMENT') comments++;
        else if (r.type.indexOf('LIKE') === 0) likes++;
        // calendar-simulation feeds record likes as a per-post counter, not LIKE_* rows
        if (typeof r.likes === 'number') likes += r.likes;
      });
      var html = '<div class="forum-bar">' +
        '<span class="forum-switch">' +
          '<button type="button" data-plat="twitter" class="' + (plat === 'twitter' ? 'active' : '') + '">Twitter</button>' +
          '<button type="button" data-plat="reddit" class="' + (plat === 'reddit' ? 'active' : '') + '">Reddit</button>' +
        '</span>' +
        '<span class="forum-stats">' + posts + ' ' + esc(drfT('forum.posts')) + ' · ' + comments + ' ' + esc(drfT('forum.comments')) + ' · ' + likes + ' ' + esc(drfT('forum.likes')) + '</span>' +
        '</div><div class="feed">';
      var shown = 0;
      rows.forEach(function (r) {
        if (!r.content || (r.type !== 'CREATE_POST' && r.type !== 'CREATE_COMMENT')) return;
        var isComment = r.type === 'CREATE_COMMENT';
        var agent = String(r.agent == null ? '' : r.agent);
        html += '<div class="feed-item' + (isComment ? ' feed-comment' : '') + '">' +
          '<div class="feed-head"><span class="feed-avatar" style="background:' + colorFor(agent) + '">' + esc(agent.slice(0, 1).toUpperCase()) + '</span>' +
          '<strong>' + esc(agent) + '</strong>' +
          (isComment ? '<span class="feed-kind">↪ ' + esc(drfT('forum.comment')) + '</span>' : '') +
          '<span class="feed-round">' + esc(drfT('forum.round')) + ' ' + (r.round == null ? '—' : r.round) + '</span></div>' +
          '<p class="feed-content">' + esc(r.content) + '</p></div>';
        shown++;
      });
      if (!shown) html += '<p class="md-loading">' + esc(drfT('forum.empty')) + '</p>';
      html += '</div>';
      return html;
    });
  }
  function bindForumSwitch() {
    var btns = body.querySelectorAll('.forum-switch button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () {
        renderForum._plat = this.getAttribute('data-plat');
        delete rendered.forum;
        show('forum');
      });
    }
  }

  function renderReport() {
    return fetchJSONOptional('meta.json').then(function (meta) {
      var pick = pickDoc(meta, 'report', 'report.md');
      return fetchText(pick.file).then(function (md) {
        return docLangBar('report', pick) + mdBody(pick, md);
      });
    });
  }

  var STAGES = {
    log:      { intro: 'log.intro',     render: renderLog },
    dossier:  { intro: 'dossier.brief', render: renderDossier, after: bindDocLang },
    ontology: { intro: 'onto.intro',    render: renderOntology },
    graph:    { intro: 'graph.intro',   render: renderGraphTab, after: mountGraph },
    forum:    { intro: 'forum.intro',   render: renderForum, after: bindForumSwitch },
    report:   { intro: 'report.intro',  render: renderReport, after: bindDocLang }
  };
  STAGES.dossier.intro = null; // dossier renders its own section headings

  function show(tab) {
    currentTab = tab;
    var btns = document.querySelectorAll('.stage-tabs button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-tab') === tab);
    var stage = STAGES[tab];
    intro.textContent = stage.intro ? drfT(stage.intro) : '';
    if (rendered[tab] && tab !== 'graph') {
      body.innerHTML = rendered[tab];
      if (stage.after) stage.after();
      window.scrollTo(0, 0);
      return;
    }
    setLoading();
    stage.render().then(function (html) {
      if (currentTab !== tab) return; // user already switched away
      rendered[tab] = html;
      body.innerHTML = html;
      if (stage.after) stage.after();
      window.scrollTo(0, 0);
    }).catch(function (e) { if (currentTab === tab) setError(e); });
  }

  document.addEventListener('DOMContentLoaded', function () {
    document.title = drfT(RUN_KEYS[runKey]) + ' — DeepAgentForecast';
    fetchJSON('meta.json').then(function (m) {
      document.getElementById('prompt-text').textContent = m.prompt || '—';
    }).catch(function () {
      document.getElementById('prompt-text').textContent = '—';
    });
    var btns = document.querySelectorAll('.stage-tabs button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].addEventListener('click', function () { show(this.getAttribute('data-tab')); });
    }
    show('report');
  });

  // language switch: re-render the current tab (labels inside content) and title;
  // report and dossier follow the new site language again
  document.addEventListener('drf:lang', function () {
    rendered = {};
    docLang = {};
    document.title = drfT(RUN_KEYS[runKey]) + ' — DeepAgentForecast';
    show(currentTab);
  });
})();
</script>

</body>
</html>
