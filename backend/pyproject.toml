[project]
name = "mirofish-backend"
version = "0.1.0"
# EXECPLAN2 F-11-1: 提高到 >=3.12 与现实一致 —— falkordblite/redis 仅在 3.12+ 可装，
# 3.11 装上后本地图谱后端缺失，等于不可用。契约对齐后下方 markers 即可去冗余。
description = "MiroFish - 简洁通用的群体智能引擎，预测万物"
requires-python = ">=3.12"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    # LLM_HTTP2 defaults on; declare httpx's HTTP/2 runtime instead of warning
    # and silently falling back to HTTP/1.1 on every client construction.
    "h2>=4.1.0",

    # 本地知识图谱（替代 Zep Cloud，无需 API Key）：
    #   graphiti-core = 本地时序知识图谱内核（Zep Cloud 的开源底座）。
    #   falkordblite = 嵌入式 FalkorDB（无需 Docker，Python>=3.12）。
    #   sentence-transformers = 本地多语言向量嵌入（中英文）。
    "graphiti-core==0.29.2",
    "falkordblite>=0.5.0",
    "redis<8",
    "sentence-transformers>=3.0.0",

    # OASIS 社交媒体模拟
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",

    # 确定性预测可视化：Plotly 交互图 + Kaleido 静态导出，matplotlib 为无 Chrome/导出失败回退。
    # 这些是默认开启的生产能力，不得只靠开发机里偶然残留的包；否则 `uv sync` 会卸载整套图表栈。
    "plotly>=5.18.0",
    "kaleido>=1.3.0",
    "matplotlib>=3.7.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[tool.uv]
# camel-oasis==0.2.5 hard-pins neo4j==5.23.0 while graphiti-core declares neo4j>=5.26.0.
# We never use the Neo4j backend (the local knowledge graph runs on embedded FalkorDB), so
# the Neo4j client version is irrelevant at runtime. Override to satisfy both and unblock
# resolution. Verified: graphiti-core 0.29.2 builds + searches fine with neo4j 5.23.0.
override-dependencies = ["neo4j==5.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# EXECPLAN2 I-7-0: offline-first test harness. `uv run pytest` (or `npm run test`)
# runs the golden/unit tests under backend/tests/ without touching any LLM/network.
[tool.pytest.ini_options]
testpaths = ["tests"]
# INFRA-12: markers are strict so a typo cannot silently widen the egress guard;
# live integration tests are opt-in (`pytest -m integration`).
addopts = "-q --strict-markers -m 'not integration'"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "integration: live test that may use the network and real providers; deselected by default and exempt from the egress guard",
    "localhost: allow loopback (127.0.0.1 / ::1) socket connects under the egress guard",
    "subprocess_egress: allow spawning provider CLIs (claude, codex, curl, wget) and pipeline child scripts under the egress guard",
]

# EXECPLAN2 I-7-6: lint gate. Scoped to the cheap, high-signal rules so it can be a
# CI gate without churn: pyflakes (F) + a few error-prone bugbear/comprehension checks.
[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["**/__pycache__"]

[tool.ruff.lint]
select = ["F", "E9", "B", "C4"]
ignore = ["F401", "F841", "B008"]
