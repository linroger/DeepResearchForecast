# EXECPLAN2 I-7-1: tiered CI. All jobs are offline (no LLM/network) and fast, so
# they can gate every PR. Heavy e2e (real research/sim) is intentionally excluded.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# INFRA-12: a newer push to the same ref supersedes the run in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-drift:
    name: Lint + env-drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Ruff lint (F/E9/B/C4)
        run: uvx ruff check backend/app backend/scripts deerflow_bridge
      - name: .env.example <-> Config drift
        run: python3 backend/scripts/check_env_drift.py --strict

  unit:
    name: Offline backend test suite (TZ=${{ matrix.tz || 'UTC' }})
    runs-on: ubuntu-latest
    # INFRA-12: run the suite twice, in UTC and in a negative-offset zone where the
    # local date lags the UTC date, so naive local-time date logic shows up in CI.
    strategy:
      fail-fast: false
      matrix:
        tz: ['', 'America/New_York']
    env:
      TZ: ${{ matrix.tz }}
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python 3.12
        run: uv python install 3.12
      # `uv run` syncs backend/.venv from backend/uv.lock (dev group included) before
      # running; the markers, --strict-markers and the default `-m 'not integration'`
      # come from [tool.pytest.ini_options] in backend/pyproject.toml.
      - name: Run full offline backend suite (uv run syncs backend/.venv, then pytest)
        run: cd backend && uv run pytest -q

  byte-compile:
    name: Byte-compile (syntax) all backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: compileall
        run: python -m compileall -q backend/app backend/scripts deerflow_bridge
