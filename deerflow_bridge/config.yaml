# ============================================================================
# Tool Groups Configuration
# ============================================================================
# Define groups of tools for organization and access control

tool_groups:
  - name: web
  - name: file:read
  - name: file:write
  - name: bash

# ============================================================================
# Tools Configuration
# ============================================================================
# Configure available tools for the agent to use

tools:
  # ITEM 6 —— web_search 后端调度器（degrade-safe，env 择优选后端）。
  # YAML 无法按 env 条件在 serper/tavily/ddg 之间挑选，故用一个**单一** web_search 工具在
  # 调用时按已配的 key 择优：SERPER_API_KEY→Serper（Google），否则 TAVILY_API_KEY→Tavily，
  # 都没配（零 key）→ 社区 DDG。它把调用**原样委派**给 harness 自带的对应 community 工具函数
  # （deerflow.community.{serper,tavily,ddg_search}.tools），因此行为与直接在此选那个 provider
  # 逐字节一致；被委派工具仍读**本** stanza 的 max_results（10），同参。零 key → byte-equivalent
  # DDG 行为。裸模块名（search_tools:web_search_tool）经 reflection 从脚本目录导入，同 market_tools。
  # WAVE9 —— 调度器内置**搜索结果磁盘缓存**（镜像 web_fetch 的 cached_fetch 模式）：3 条并行
  # 研究轨 × 至多 8 个 fan-out worker 围着同一 brief 搜索，近重复 query 不再重发。env 旋钮：
  # RESEARCH_SEARCH_CACHE_TTL_H（默认 6h，0=关闭）/ RESEARCH_SEARCH_CACHE_DIR /
  # RESEARCH_SEARCH_CACHE_MAX_MB（默认 200，mtime LRU 淘汰）。只缓存成功非空结果；缓存层
  # 任何异常 → 透明直连，不改变搜索结果本身。
  - name: web_search
    group: web
    use: search_tools:web_search_tool
    # 深研究单轮吃 10 条结果比 5 条覆盖面翻倍，且成本只在 prompt 长度上（无额外请求）。
    # 本值同时被调度器委派的后端读取（serper/tavily/ddg 都读 get_tool_config("web_search")）。
    max_results: 10
    # backend: auto          # DDG 后端专用：DDGS backend(s) — auto, duckduckgo, brave, wikipedia, ...
    # region: wt-wt          # DDG 后端专用：wt-wt is normalized for Wikipedia when backend includes auto/all/wikipedia.
    # safesearch: moderate   # DDG 后端专用：on, moderate, off

  # 说明：下面几段单一 provider 的 web_search stanza 现由上方 search_tools 调度器统一取代
  # （启用其一会与调度器的 web_search 同名冲突，请保持注释）。要**强制**只用某个后端，可注释掉
  # 上方 search_tools 段并解开对应段——不改变各 provider 的实现路径，仅换回静态选择。
  #
  # Web search tool (uses Serper - Google Search API, requires SERPER_API_KEY)
  # Serper provides real-time Google Search results. Sign up at https://serper.dev
  # Note: set SERPER_API_KEY in your environment before starting the app, or
  # uncomment and fill in api_key below (the $VAR syntax is resolved at startup).
  # - name: web_search
  #   group: web
  #   use: deerflow.community.serper.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $SERPER_API_KEY  # Optional if SERPER_API_KEY env var is set

  # Web search tool (requires Tavily API key)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.tavily.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $TAVILY_API_KEY  # Set if needed

  # Web search tool (uses InfoQuest, requires InfoQuest API key)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_search_tool
  #   # Used to limit the scope of search results, only returns content within the specified time range. Set to -1 to disable time filtering
  #   search_time_range: 10

  # Web search tool (uses Exa, requires EXA_API_KEY)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.exa.tools:web_search_tool
  #   max_results: 5
  #   search_type: auto  # Options: auto, neural, keyword
  #   contents_max_characters: 1000
  #   # api_key: $EXA_API_KEY

  # Web search tool (uses Firecrawl, requires FIRECRAWL_API_KEY)
  # - name: web_search
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_search_tool
  #   max_results: 5
  #   # api_key: $FIRECRAWL_API_KEY

  # Web fetch tool (uses Exa)
  # NOTE: Only one web_fetch provider can be active at a time.
  # Comment out the Jina AI web_fetch entry below before enabling this one.
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.exa.tools:web_fetch_tool
  #   # api_key: $EXA_API_KEY

  # ITEM 10 —— web_fetch 跨 run 源缓存（透明包裹 Jina AI reader）。
  # cached_fetch 在 jina 之外加一层磁盘缓存：同一 URL 跨 pass/跨 run（续跑/双轨/fan-out/覆盖
  # top-up）命中即秒回，返回类型与 jina 一致（str），对 agent 透明。缓存目录/TTL/上限经 env
  # RESEARCH_SOURCE_CACHE_DIR / _TTL_H(默认72) / _MAX_MB(默认500) 调；失败/哨兵/死抓取(<200字符)
  # 绝不落盘。真正抓取仍走 jina，且它读**本** stanza 的 timeout(30)——与直接配置 jina 同参。
  # 30s：重量级一手来源（监管文件/年报/长 PDF 转写）经 Jina reader 常超过 10s，
  # 超时=整条来源丢失；research 回合本身是分钟级的，等 30s 换全文值得。
  - name: web_fetch
    group: web
    use: cached_fetch:web_fetch_tool
    timeout: 30

  # Web fetch tool (uses InfoQuest)
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.infoquest.tools:web_fetch_tool
  #   # Overall timeout for the entire crawling process (in seconds). Set to positive value to enable, -1 to disable
  #   timeout: 10
  #   # Waiting time after page loading (in seconds). Set to positive value to enable, -1 to disable
  #   fetch_time: 10
  #   # Timeout for navigating to the page (in seconds). Set to positive value to enable, -1 to disable
  #   navigation_timeout: 30

  # Web fetch tool (uses Firecrawl, requires FIRECRAWL_API_KEY)
  # - name: web_fetch
  #   group: web
  #   use: deerflow.community.firecrawl.tools:web_fetch_tool
  #   # api_key: $FIRECRAWL_API_KEY

  # Prediction-market search (Polymarket 官方公开 Gamma API——keyless、无需钱包)。
  # `use:` 是裸模块路径：deerflow_research.py 以 `python <deer-flow>/deerflow_research.py`
  # 启动（pipeline_orchestrator cwd=deer-flow/），sys.path[0] 即脚本目录，market_tools.py
  # 与本 config 同步部署在同一目录后即可导入。工具本身 degrade-safe（网络失败→空结果）；
  # 配套 skill：skills/prediction-markets/SKILL.md（查询构造/过滤/校准锚点纪律）。
  - name: prediction_market_search
    group: web
    use: market_tools:prediction_market_search_tool

  - name: data_search
    group: web
    use: data_tools:data_search_tool
  - name: data_get
    group: web
    use: data_tools:data_get_tool

  # Image search tool (uses DuckDuckGo)
  # Use this to find reference images before image generation
  - name: image_search
    group: web
    use: deerflow.community.image_search.tools:image_search_tool
    max_results: 5

  # Image search tool (uses InfoQuest)
  # - name: image_search
  #   group: web
  #   use: deerflow.community.infoquest.tools:image_search_tool
  #   # Used to limit the scope of image search results, only returns content within the specified time range. Set to -1 to disable time filtering
  #   image_search_time_range: 10
  #   # Image size filter. Options: "l" (large), "m" (medium), "i" (icon).
  #   image_size: "i"

  # File operations tools
  - name: ls
    group: file:read
    use: deerflow.sandbox.tools:ls_tool

  - name: read_file
    group: file:read
    use: deerflow.sandbox.tools:read_file_tool

  - name: glob
    group: file:read
    use: deerflow.sandbox.tools:glob_tool
    max_results: 200

  - name: grep
    group: file:read
    use: deerflow.sandbox.tools:grep_tool
    max_results: 100

  - name: write_file
    group: file:write
    use: deerflow.sandbox.tools:write_file_tool

  - name: str_replace
    group: file:write
    use: deerflow.sandbox.tools:str_replace_tool

  # Bash execution tool
  # Active only when using an isolated shell sandbox or when
  # sandbox.allow_host_bash: true explicitly opts into host bash.
  # 本部署已在下方 sandbox.allow_host_bash: true——故此 stanza 当前对 agent
  # 可见（group==bash 触发 tools/tools.py 的 host-bash 过滤，仅在开关为 true 时放行）。
  # 它是 chart-visualization / data-analysis / forecast-visuals 等脚本型技能的执行面。
  - name: bash
    group: bash
    use: deerflow.sandbox.tools:bash_tool

# ============================================================================
# Tool Search Configuration (Deferred Tool Loading)
# ============================================================================
# When enabled, MCP tools are not loaded into the agent's context directly.
# Instead, they are listed by name in the system prompt and discoverable
# via the tool_search tool at runtime.
# This reduces context usage and improves tool selection accuracy when
# multiple MCP servers expose a large number of tools.

tool_search:
  enabled: false

# ============================================================================
# Tool Output Budget Protection
# ============================================================================
# Prevents oversized tool results from blowing the model context window.
# Outputs exceeding `externalize_min_chars` are persisted to disk and replaced
# with a compact preview + file reference. The model can read the full output
# via read_file.  When disk persistence is unavailable, outputs exceeding
# `fallback_max_chars` are head+tail truncated instead.
#
# `exempt_tools` prevents persist→read→persist infinite loops for read tools.
# `tool_overrides` allows per-tool threshold customization.

tool_output:
  enabled: true
  externalize_min_chars: 12000
  preview_head_chars: 2000
  preview_tail_chars: 1000
  fallback_max_chars: 30000
  fallback_head_chars: 8000
  fallback_tail_chars: 3000
  storage_subdir: ".tool-results"
  exempt_tools:
    - read_file
    - read_file_tool
  # LOOP-009: keep fetched primaries losslessly on disk but stop replaying each
  # long page through every later model step.  The workflow prompts explicitly
  # permit read_file for these harness-managed result paths.
  tool_overrides:
    web_fetch: 12000

# ============================================================================
# Loop Detection Configuration
# ============================================================================
# Detect and interrupt repeated identical tool-call loops.
# Frequency thresholds are safety limits for repeated use of the same tool type.

loop_detection:
  enabled: true
  warn_threshold: 3
  hard_limit: 5
  window_size: 20
  max_tracked_threads: 100
  tool_freq_warn: 30
  tool_freq_hard_limit: 50
  # Per-tool overrides for tool_freq_warn / tool_freq_hard_limit. Values can be
  # higher or lower than the global defaults. Commonly used to raise thresholds
  # for high-frequency tools like bash in batch workflows (e.g. RNA-seq pipelines)
  # without weakening protection on every other tool.
  #
  # web_search / web_fetch get research-grade budgets: a single deep-research
  # pass legitimately performs dozens of searches and fetches. Counters reset
  # at the start of each agent run (bridge middleware patch), so these are
  # per-pass limits, not per-thread.
  tool_freq_overrides:
    web_search:
      warn: 100
      hard_limit: 150
    web_fetch:
      warn: 100
      hard_limit: 150
    data_search:
      warn: 30
      hard_limit: 45
    data_get:
      warn: 30
      hard_limit: 45

# ============================================================================
# Provider Safety Termination Configuration
# ============================================================================
# Intercept AIMessages where the provider stopped generation for safety reasons
# (e.g. OpenAI finish_reason='content_filter', Anthropic stop_reason='refusal',
# Gemini finish_reason='SAFETY') while still returning tool_calls. The
# tool_calls in such responses are typically truncated/unreliable and must
# not be executed. See issue #3028 for the full failure mode.
#
# Detectors are loaded by class path via reflection (same pattern as
# guardrails / models / tools). The built-in set covers OpenAI-compatible
# content_filter, Anthropic refusal, and Gemini SAFETY/BLOCKLIST/
# PROHIBITED_CONTENT/SPII/RECITATION.

safety_finish_reason:
  enabled: true
  # Leave `detectors` unset to use the built-in detector set. Set to a
  # non-empty list to fully override (use `enabled: false` to disable instead
  # of providing an empty list).
  #
  # Example — extend the OpenAI-compatible detector for a Chinese provider
  # whose gateway uses a non-standard finish_reason token:
  # detectors:
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:OpenAICompatibleContentFilterDetector
  #     config:
  #       finish_reasons: ["content_filter", "sensitive", "risk_control"]
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:AnthropicRefusalDetector
  #   - use: deerflow.agents.middlewares.safety_termination_detectors:GeminiSafetyDetector
  #
  # Example — add a custom detector for an in-house provider:
  # detectors:
  #   - use: my_company.deerflow_ext:WenxinSafetyDetector
  #     config:
  #       error_codes: [336003, 17, 18]

# ============================================================================
# Sandbox Configuration
# ============================================================================
# Choose between local sandbox (direct execution) or Docker-based AIO sandbox

# Option 1: Local Sandbox (Default)
# Executes commands directly on the host machine
uploads:
  # Application-level upload limits enforced by the gateway and exposed to the
  # frontend before file selection.
  max_files: 10
  max_file_size: 52428800    # 50 MiB
  max_total_size: 104857600  # 100 MiB
  # Automatic Office/PDF conversion runs on the backend host before sandbox
  # isolation applies. Keep this disabled unless uploads come from a fully
  # trusted source and you intentionally accept host-side parser risk.
  auto_convert_documents: false
  # Controls which PDF-to-Markdown converter is used whenever PDF conversion
  # runs. Automatic upload conversion is gated separately by
  # auto_convert_documents.
  # auto        — prefer pymupdf4llm when installed; fall back to MarkItDown for
  #               image-based or encrypted PDFs (recommended default).
  # pymupdf4llm — always use pymupdf4llm (must be installed: uv add pymupdf4llm).
  #               Better heading/table extraction; faster on most files.
  # markitdown  — always use MarkItDown (original behaviour, no extra dependency).
  pdf_converter: auto

sandbox:
  use: deerflow.sandbox.local:LocalSandboxProvider
  # Host bash execution is disabled by default because LocalSandboxProvider is
  # not a secure isolation boundary for shell access. Enable only for fully
  # trusted, single-user local workflows.
  #
  # ENABLED HERE (allow_host_bash: true) — 这是一个受信任的本地单用户部署
  # (trusted local single-user deployment)：整条 forecasting pipeline 在本机以
  # 当前用户身份运行，没有多租户 / 不接收外部不可信输入，因此把 LocalSandbox 当
  # 作「与用户同权限的执行面」是可接受的取舍。打开 host bash 的直接收益：解锁
  # 那些以脚本形式打包的 skills——chart-visualization（`node scripts/generate.js`
  # 渲染 26 种 AntV 图表）与 data-analysis 之类需要真实 shell / node / python 才
  # 能出图出表的技能；forecast-visuals 路由技能正是靠它把 pipeline 工件渲染成
  # 图。作用机制见上方 tools: 段的 `bash` 条目——tools/tools.py::_is_host_bash_tool
  # 会在 is_host_bash_allowed(config)==False 时把 group==bash / bash_tool 的工具
  # 过滤掉；本开关置 true 后该过滤解除，bash 工具正式对 agent 暴露（激活 tools:
  # 段的 bash stanza）。任何一台不满足「完全受信任、单用户」前提的机器都应改回
  # false，并让 forecast-visuals 走它的 NO-BASH mermaid 降级路径。
  allow_host_bash: true
  # Optional: Mount additional host directories into the sandbox.
  # Each mount maps a host path to a virtual container path accessible by the agent.
  # mounts:
  #   - host_path: /home/user/my-project    # Absolute path on the host machine
  #     container_path: /mnt/my-project     # Virtual path inside the sandbox
  #     read_only: true                     # Whether the mount is read-only (default: false)

  # Tool output truncation limits (characters).
  # bash uses middle-truncation (head + tail) since errors can appear anywhere in the output.
  # read_file and ls use head-truncation since their content is front-loaded.
  # Set to 0 to disable truncation.
  bash_output_max_chars: 20000
  read_file_output_max_chars: 50000
  ls_output_max_chars: 20000

# Option 2: Container-based AIO Sandbox
# Executes commands in isolated containers (Docker or Apple Container)
# On macOS: Automatically prefers Apple Container if available, falls back to Docker
# On other platforms: Uses Docker
# Uncomment to use:
# sandbox:
#   use: deerflow.community.aio_sandbox:AioSandboxProvider
#
#   # Optional: Container image to use (works with both Docker and Apple Container)
#   # Default: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
#   # Recommended: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest (works on both x86_64 and arm64)
#   # image: enterprise-public-cn-beijing.cr.volces.com/vefaas-public/all-in-one-sandbox:latest
#
#   # Optional: Base port for sandbox containers (default: 8080)
#   # port: 8080

#   # Optional: Maximum number of concurrent sandbox containers (default: 3)
#   # When the limit is reached the least-recently-used sandbox is evicted to
#   # make room for new ones. Use a positive integer here; omit this field to use the default.
#   # replicas: 3
#
#   # Optional: Prefix for container names (default: deer-flow-sandbox)
#   # container_prefix: deer-flow-sandbox
#
#   # Optional: Additional mount directories from host to container
#   # NOTE: Skills directory is automatically mounted from skills.path to skills.container_path
#   # mounts:
#   #   # Other custom mounts
#   #   - host_path: /path/on/host
#   #     container_path: /home/user/shared
#   #     read_only: false
#   #
#   #   # DeerFlow will surface configured container_path values to the agent,
#   #   # so it can directly read/write mounted directories such as /home/user/shared
#
#   # Optional: Environment variables to inject into the sandbox container
#   # Values starting with $ will be resolved from host environment variables
#   # environment:
#   #   NODE_ENV: production
#   #   DEBUG: "false"
#   #   API_KEY: $MY_API_KEY        # Reads from host's MY_API_KEY env var
#   #   DATABASE_URL: $DATABASE_URL  # Reads from host's DATABASE_URL env var

# Option 3: Provisioner-managed AIO Sandbox (docker-compose-dev)
# Each sandbox_id gets a dedicated Pod in k3s, managed by the provisioner.
# Recommended for production or advanced users who want better isolation and scalability.:
# sandbox:
#   use: deerflow.community.aio_sandbox:AioSandboxProvider
#   provisioner_url: http://provisioner:8002

# ============================================================================
# Subagents Configuration
# ============================================================================
# Configure timeouts for subagent execution
# Subagents are background workers delegated tasks by the lead agent

# subagents:
#   # Default timeout in seconds for all subagents (default: 900 = 15 minutes)
#   timeout_seconds: 900
#   # Optional global max-turn override for all subagents
#   # max_turns: 120
#
#   # Optional per-agent overrides (applies to both built-in and custom agents)
#   agents:
#     general-purpose:
#       timeout_seconds: 1800  # 30 minutes for complex multi-step tasks
#       max_turns: 160
#       # model: qwen3:32b     # Use a specific model (default: inherit from lead agent)
#       # skills:               # Skill whitelist (default: inherit all enabled skills)
#       #   - web-search
#       #   - data-analysis
#     bash:
#       timeout_seconds: 300   # 5 minutes for quick command execution
#       max_turns: 80
#       # skills: []            # No skills for bash agent
#
#   # Custom subagent types: define specialized agents with their own prompts,
#   # tools, skills, and model configuration. Custom agents are available via
#   # the `task` tool alongside built-in types (general-purpose, bash).
#   # custom_agents:
#   #   analysis:
#   #     description: "Data analysis specialist for processing datasets and generating insights"
#   #     system_prompt: |
#   #       You are a data analysis subagent. Focus on:
#   #       - Processing and analyzing datasets
#   #       - Generating visualizations
#   #       - Providing statistical insights
#   #     tools:                  # Tool whitelist (null = inherit all)
#   #       - bash
#   #       - read_file
#   #       - write_file
#   #     skills:                 # Skill whitelist (null = inherit all, [] = none)
#   #       - data-analysis
#   #       - visualization
#   #     model: inherit          # 'inherit' uses parent's model
#   #     max_turns: 80
#   #     timeout_seconds: 600
#
#   # Model override: by default, subagents inherit the lead agent's model.
#   # Set `model` to use a different model (e.g., a local Ollama model for cost savings).
#   # The model name must match a name defined in the `models:` section above.

# ---------------------------------------------------------------------------
# ACTIVE subagents block（真委派：给 deep-research lead agent 一个可派活的 scoped 子代理）
# ---------------------------------------------------------------------------
# 只有当本轮以 `--subagents` 启动（deerflow_research.py 把 subagent_enabled=True 传给
# DeerFlowClient，解锁 harness 内建 `task` 工具，lead agent 才能委派）时，下面这些配置才
# 有意义——它们不「打开」委派（那由运行期 subagent_enabled 决定），而是**配置**被委派的
# 子代理长什么样、能用哪些工具/技能、跑多久。未加 `--subagents` 时该块被解析但从不触达。
# 字段名对齐 harness 的 SubagentsAppConfig / CustomSubagentConfig（config/subagents_config.py）。
#
# 并发上限（可调）：harness 把单条 model 回复里的并行 `task` 调用数截到 subagents.max_concurrent
# （SubagentLimitMiddleware，取值域 clamp 到 [1,8]），调度线程池按 clamp 上限（8）固定开池以提供余量，
# 实际并发由本字段封顶；因 `task` 工具在单响应内 await 各子代理至终态，后台同时在飞数即等于该上限。
# env DEER_FLOW_MAX_CONCURRENT_SUBAGENTS 覆盖本 config 值（同样 clamp [1,8]，越界降级到边界、非法值忽略）。
# 本轮设 5，研究提示词因此让 lead 一次派 3–5 个并行子任务，与该上限对齐。
subagents:
  # 默认超时/步进：deep 子调查是 search→fetch→read 的多步活，给足预算（对齐内建 general-purpose
  # 已抬到的 1800s）。这两项是 built-in 子代理（general-purpose/bash）的全局默认；custom 子代理
  # 用它自己 custom_agents 段里的 timeout_seconds/max_turns（除非在 agents: 段给同名 per-agent 覆盖）。
  timeout_seconds: 1800   # 30 min —— 复杂多步子调查的默认上限
  max_turns: 160          # built-in 子代理的全局默认步数上限（custom 见其自身 max_turns）
  max_concurrent: 5       # 同时在飞的并行子代理上限（clamp [1,8]；env DEER_FLOW_MAX_CONCURRENT_SUBAGENTS 覆盖）——本轮从 3 抬到 5
  # 自定义子代理类型：scoped-researcher —— 面向「一个 KIQ / 一个 actor / 一个 driver」的并行
  # 定域网页调查员。经 `task` 工具与 general-purpose/bash 并列可选。其 system_prompt 内嵌
  # deep-research 的核心纪律（S1–S4 分级、2 个独立来源三角验证、只记真实已抓取 URL、回传带
  # 分级的证据笔记 + 来源清单——不是成稿报告），让子代理产出可直接被 lead 校验并入的证据。
  custom_agents:
    scoped-researcher:
      description: "parallel scoped web investigator for one KIQ/actor/driver — dispatch it for breadth (per-actor profiles, per-KIQ evidence sweeps, regional/language pivots, disconfirmation hunts); returns graded evidence notes + a real fetched-URL list, NOT a polished report"
      system_prompt: |
        You are a SCOPED-RESEARCHER sub-agent inside a larger forecasting research effort.
        Your dispatcher (the lead analyst) gave you exactly ONE narrow focus — one Key
        Intelligence Question, one actor, one driver, or one language/region pivot. Investigate
        ONLY that, in depth, and hand back evidence the lead can verify and integrate. You do
        NOT write the report; another agent synthesizes.

        TOOLING: This is WEB research. Work via `web_search` and `web_fetch`; when the assigned
        focus has a forecastable outcome, use `prediction_market_search` for calibration.
        When available, use `data_search` and `data_get` for official observations; preserve
        exact units, periods, dataset URLs and provisional citations. Search metadata is
        discovery only; keep publisher projections labelled separately from observations.
        `read_file` is only for an activated skill or a harness-managed externalized tool
        result; do not browse an arbitrary local corpus. Your evidence comes from pages and
        markets you actually fetch.

        CORE DISCIPLINE (deep-research tradecraft — non-negotiable):
        - SOURCE TIERING: grade every source S1 (primary: filings, official records, datasets,
          first-party statements), S2 (high-authority secondary: major press, expert analysis),
          S3 (ordinary secondary), S4 (weak/unknown). Prefer S1/S2; label each note's tier.
        - TRIANGULATION: a load-bearing claim needs ≥2 INDEPENDENT origins (not two outlets
          re-printing one wire). If you have only a single origin, say so explicitly.
        - REAL FETCHED URLS ONLY: record only a source you ACTUALLY fetched and read, with its
          real URL and its on-page publication date. NEVER fabricate or future-date a source,
          URL, title, or date. A claim with no real fetched URL is not evidence — drop it.
        - SEARCH DISCIPLINE: one fact, at most two attempts; never reissue a near-duplicate
          query — change the ANGLE (different actor/mechanism/document type/language/time
          window). Breadth over hunting a white whale within your focus.
        - DISCONFIRMATION: actively look for the strongest evidence AGAINST your focus's
          load-bearing claim, not just confirming sources.

        RETURN FORMAT — graded evidence notes, NOT a report. End with Markdown:
        ## Evidence gathered (each item: the claim, its source tier S1–S4, and the fetched URL)
        ## Contradictions / uncertainty (disputed claims, the differing positions + their sources)
        ## Sources (title + REAL fetched URL + on-page date, one per line)
        Keep it dense and sourced. Do not editorialize beyond what your fetched pages support.
      tools:                  # 工具白名单（只给检索+读写笔记；不含 bash/task，杜绝越权与递归委派）
        - web_search
        - web_fetch
        - prediction_market_search
        - data_search
        - data_get
        - read_file
        - write_file
      skills:                 # 技能白名单：搜证纪律 + 市场锚点
        - deep-research
        - prediction-markets
        - data-sources
      model: inherit          # 继承 lead 的模型（与主研究同一档推理/工具调用能力）
      max_turns: 120          # 单个定域子调查的步数上限（多步 search→fetch→read 够用、又有界）
      timeout_seconds: 1800   # 30 min —— 与全局默认一致，deep 子调查不被过早掐断

# ============================================================================
# ACP Agents Configuration
# ============================================================================
# Configure external ACP-compatible agents for the built-in `invoke_acp_agent` tool.

# acp_agents:
#   claude_code:
#     # DeerFlow expects an ACP adapter here. The standard `claude` CLI does not
#     # speak ACP directly. Install `claude-agent-acp` separately or use:
#     command: npx
#     args: ["-y", "@zed-industries/claude-agent-acp"]
#     description: Claude Code for implementation, refactoring, and debugging
#     model: null
#     # auto_approve_permissions: false  # Set to true to auto-approve ACP permission requests
#     # env:                             # Optional: inject environment variables into the agent subprocess
#     #   ANTHROPIC_API_KEY: $ANTHROPIC_API_KEY  # $VAR resolves from host environment
#
#   codex:
#     # DeerFlow expects an ACP adapter here. The standard `codex` CLI does not
#     # speak ACP directly. Install `codex-acp` separately or use:
#     command: npx
#     args: ["-y", "@zed-industries/codex-acp"]
#     description: Codex CLI for repository tasks and code generation
#     model: null
#     # auto_approve_permissions: false  # Set to true to auto-approve ACP permission requests
#     # env:                             # Optional: inject environment variables into the agent subprocess
#     #   OPENAI_API_KEY: $OPENAI_API_KEY  # $VAR resolves from host environment

# ============================================================================
# Skills Configuration
# ============================================================================
# Configure skills directory for specialized agent workflows

skills:
  # Path to skills directory on the host (relative to project root or absolute)
  # Default: skills under the project root
  # Override with DEER_FLOW_SKILLS_PATH when this field is omitted.
  # Uncomment to customize:
  # path: /absolute/path/to/custom/skills

  # Path where skills are mounted in the sandbox container
  # This is used by the agent to access skills in both local and Docker sandbox
  # Default: /mnt/skills
  container_path: /mnt/skills

# Note: To restrict which skills are loaded for a specific custom agent,
# define a `skills` list in that agent's `config.yaml` (e.g. `agents/my-agent/config.yaml`):
# - Omitted or null: load all globally enabled skills (default)
# - []: disable all skills for this agent
# - ["skill-name"]: load only specific skills

# ============================================================================
# Title Generation Configuration
# ============================================================================
# Automatic conversation title generation settings

# Bridge runs are headless one-shots — a generated conversation title is never
# shown anywhere, so skip the extra LLM call per research run.
title:
  enabled: false
  max_words: 6
  max_chars: 60
  model_name: null # Use default model (first model in models list)

# ============================================================================
# Summarization Configuration
# ============================================================================
# Automatically summarize conversation history when token limits are approached
# This helps maintain context in long conversations without exceeding model limits

summarization:
  enabled: true

  # Model to use for summarization (null = use default model)
  # Recommended: Use a lightweight, cost-effective model like "gpt-4o-mini" or similar
  model_name: null

  # Trigger conditions - at least one required
  # Summarization runs when ANY threshold is met (OR logic)
  # You can specify a single trigger or a list of triggers
  trigger:
    # LOOP-009: recent runs replayed 78M+ input tokens.  A million-token model
    # window is capacity, not an efficient operating target: agent steps resend
    # the whole thread.  Compress at 80K, after the evidence ledger/checkpoint has
    # captured fetched URLs and working notes.  The forecast-specific summary
    # prompt below preserves claims, numbers, gaps, markets, and provenance.
    - type: tokens
      value: 80000
    # Uncomment to also trigger when message count reaches 50
    # - type: messages
    #   value: 50
    # Uncomment to trigger when 80% of model's max input tokens is reached
    # - type: fraction
    #   value: 0.8

  # Context retention policy after summarization
  # Specifies how much recent history to preserve
  keep:
    # Keep a bounded recent-token window, not a message count: one externalized
    # tool message can be tiny while one fetched page can be enormous.
    type: tokens
    value: 16000
    # Alternative: Keep specific token count
    # type: tokens
    # value: 3000
    # Alternative: Keep percentage of model's max input tokens
    # type: fraction
    # value: 0.3

  # Summarize the WHOLE discarded segment.  A 15K ``strategy=last`` trim used to
  # expose only the tail of ~64K discarded tokens to the summarizer, silently
  # deleting early KIQ evidence.  The 80K trigger + 16K preserved tail bounds a
  # summary call to roughly 64K input tokens, which every configured research
  # model supports; no evidence disappears before the ledger can represent it.
  # Research-stage token lever 2 (A/B only — this default is unchanged): the
  # RESEARCH_TRIM_TOKENS_TO_SUMMARIZE env var overrides this value at the
  # middleware construction site without editing config. Unset → this value;
  # positive integer → cap the summarizer's input; "none"/"null"/"full" → force
  # full-segment summarization. Invalid values are logged and ignored.
  trim_tokens_to_summarize: null

  # Preserve the forecasting state instead of producing a generic chat recap.
  # This is internal working memory, not user-facing prose.
  summary_prompt: |
    Compress the research conversation below into a dense FORECAST EVIDENCE LEDGER.
    Preserve, without invention: the exact research question and horizon; KIQs and
    their status; each load-bearing claim with numbers, units, as-of dates, source
    title, real fetched URL, and S1-S4 tier; actor names, incentives, constraints,
    and directed relationships; base rates and reference classes; contradictions;
    prediction-market IDs, questions, probabilities, volumes, URLs, and timestamps;
    quantitative series; resolved and unresolved gaps; failed/dead source paths;
    and the next highest-value action. Deduplicate repeated searches and echoed
    sources. Clearly mark inference versus evidence. Do not write a polished report.

    <conversation>
    {messages}
    </conversation>

  # Recently-loaded skill files are excluded from summarization so the agent
  # does not lose skill instructions after a compression pass. Claude Code uses
  # a similar strategy (keep the most recent ~5 skills, ~25k total tokens, with
  # a ~5k cap per skill). Set preserve_recent_skill_count to 0 to disable.
  preserve_recent_skill_count: 3
  preserve_recent_skill_tokens: 15000
  preserve_recent_skill_tokens_per_skill: 5000
  skill_file_read_tool_names:
    - read_file
    - read
    - view
    - cat

# ============================================================================
# Memory Configuration
# ============================================================================
# Global memory mechanism
# Stores user context and conversation history for personalized responses
# DISABLED for the bridge: every research run is an independent question — facts
# remembered from a previous run would be injected into the next run's system
# prompt (cross-run contamination of fresh research), and each background
# memory-update is a wasted LLM call. Re-enable only for interactive use.
memory:
  enabled: false
  storage_path: memory.json # Path relative to backend directory
  debounce_seconds: 30 # Wait time before processing queued updates
  model_name: null # Use default model
  max_facts: 100 # Maximum number of facts to store
  fact_confidence_threshold: 0.7 # Minimum confidence for storing facts
  injection_enabled: false # Whether to inject memory into system prompt
  max_injection_tokens: 2000 # Maximum tokens for memory injection

# ============================================================================
# Custom Agent Management API
# ============================================================================
# Controls whether the HTTP gateway exposes custom-agent SOUL/USER.md management.
# Keep this disabled unless the gateway is behind a trusted authenticated admin boundary.
agents_api:
  enabled: false

# ============================================================================
# Skill Self-Evolution Configuration
# ============================================================================
# Allow the agent to autonomously create and improve skills in skills/custom/.
skill_evolution:
  enabled: false # Set to true to allow agent-managed writes under skills/custom
  moderation_model_name: null # Model for LLM-based security scanning (null = use default model)

# ============================================================================
# Checkpointer Configuration (DEPRECATED — use `database` instead)
# ============================================================================
# Legacy standalone checkpointer config. Kept for backward compatibility.
# Prefer the unified `database` section below, which drives BOTH the
# LangGraph checkpointer AND DeerFlow application data (runs, feedback,
# events) from a single backend setting.
#
# If both `checkpointer` and `database` are present, `checkpointer`
# takes precedence for LangGraph state persistence only.
#
# checkpointer:
#   type: sqlite
#   connection_string: checkpoints.db
#
# checkpointer:
#   type: postgres
#   connection_string: postgresql://user:password@localhost:5432/deerflow

# ============================================================================
# Database
# ============================================================================
# Unified storage backend for LangGraph checkpointer and DeerFlow
# application data (runs, threads metadata, feedback, etc.).
#
# backend: memory  -- No persistence, data lost on restart
# backend: sqlite  -- Single-node deployment, files in sqlite_dir
# backend: postgres -- Production multi-node deployment
#
# If this section is omitted or empty in config.yaml, DeerFlow uses:
#   backend: sqlite
#   sqlite_dir: .deer-flow/data
#
# SQLite mode uses a single deerflow.db file with WAL journal mode
# for both checkpointer and application data.
#
# Postgres mode: put your connection URL in .env as DATABASE_URL,
# then reference it here with $DATABASE_URL.
#
# Install the driver — Issue #2754 fix lands `UV_EXTRAS` in every code path:
#   Local      `make dev` auto-detects from `database.backend: postgres` below
#              and passes `--extra postgres` to `uv sync` on every restart, so
#              the extra is no longer wiped. To opt in explicitly (or layer
#              extras like `postgres,ollama`), set in project-root .env:
#                  UV_EXTRAS=postgres
#   Docker dev `make docker-start` reads `UV_EXTRAS` from project-root .env via
#              `env_file`. Set:
#                  UV_EXTRAS=postgres
#              Multiple extras (`postgres,ollama`) supported here too — see
#              docker/dev-entrypoint.sh.
#   Docker img build-arg `UV_EXTRAS=postgres docker compose build` — single
#              extra only at build time (backend/Dockerfile passes the value
#              as one token to `--extra`).
#
# First-time bootstrap (before `make dev`):
#   cd backend && uv sync --all-packages --extra postgres
#   (--all-packages propagates the extra into workspace members — see PR #2584)
#
# NOTE: When both `checkpointer` and `database` are configured,
# `checkpointer` takes precedence for LangGraph state persistence.
# If you use `database`, you can remove the `checkpointer` section.
# database:
#   backend: sqlite
#   sqlite_dir: .deer-flow/data
#
# database:
#   backend: postgres
#   postgres_url: $DATABASE_URL
database:
  backend: sqlite
  sqlite_dir: .deer-flow/data

# ============================================================================
# Run Events Configuration
# ============================================================================
# Storage backend for run events (messages + execution traces).
#
# backend: memory  -- No persistence, data lost on restart (default)
# backend: db      -- SQL database via ORM, full query capability (production)
# backend: jsonl   -- Append-only JSONL files (lightweight single-node persistence)
#
# run_events:
#   backend: memory
#   max_trace_content: 10240    # Truncation threshold for trace content (db backend, bytes)
#   track_token_usage: true     # Accumulate token counts to RunRow
run_events:
  backend: memory
  max_trace_content: 10240
  track_token_usage: true

