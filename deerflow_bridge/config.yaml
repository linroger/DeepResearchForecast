# Configuration for the DeerFlow application
#
# Guidelines:
# - Copy this file to `config.yaml` and customize it for your environment
# - The default path of this configuration file is `config.yaml` in the project root.
#   You can set `DEER_FLOW_PROJECT_ROOT` to define that root explicitly, or use
#   `DEER_FLOW_CONFIG_PATH` to point at a specific config file.
# - Runtime state defaults to `.deer-flow` under the project root. Override it
#   with `DEER_FLOW_HOME` when you need a different writable data directory.
# - Environment variables are available for all field values. Example: `api_key: $OPENAI_API_KEY`
# - The `use` path is a string that looks like "package_name.sub_package_name.module_name:class_name/variable_name".

# ============================================================================
# Config Version (used to detect outdated config files)
# ============================================================================
# Bump this number when the config schema changes.
# Run `make config-upgrade` to merge new fields into your local config.yaml.
config_version: 11

# ============================================================================
# Logging
# ============================================================================
# Log level for deerflow modules (debug/info/warning/error)
log_level: info

# ============================================================================
# Token Usage
# ============================================================================
# Enable token usage collection and display.
# When enabled, DeerFlow records input/output/total tokens per model call
# and shows usage metadata in the workspace UI when providers return it.
token_usage:
  enabled: true

# ============================================================================
# Models Configuration
# ============================================================================
# Configure available LLM models for the agent to use

models:
  # === ACTIVE: Claude via Claude Code subscription (OAuth, no API key) ===
  # Auto-loads the OAuth token from ~/.claude/.credentials.json (the file the
  # `claude` CLI writes). Detects sk-ant-oat tokens and bills the Max/Pro plan.
  # Keeps NATIVE tool calling (required for the deep-research tool loop).
  - name: claude
    display_name: Claude Opus 4.8 (Code plan)
    use: deerflow.models.claude_provider:ClaudeChatModel
    # ULTIMATE-RUN: deep research on the flagship Opus 4.8 via the Code-plan OAuth
    # subscription (no per-model quota, unlike the Antigravity free tier). Strongest
    # reasoning + best at following the deep-research search/grounding discipline.
    model: claude-opus-4-8
    # Extended thinking DISABLED: the `when_thinking_enabled: {thinking:{type:enabled}}` config
    # was double-nested into the request payload (-> `thinking.thinking`), causing the Anthropic
    # API to reject EVERY call with `thinking.thinking: Field required` (8/8 failures = empty
    # research). Opus 4.8's base reasoning is more than enough for tool-driven deep research, and
    # disabling thinking removes the entire error class. 64K visible-output ceiling (safe for
    # opus). Re-enable only with the correct `thinking:{type,budget_tokens}`.
    max_tokens: 64000
    context_window_tokens: 200000
    supports_thinking: false
    supports_vision: true
    # Research-stage token lever 1: cache_control breakpoints on the re-sent
    # LangGraph thread — ON by default for BOTH auth modes, the Code-plan OAuth
    # path included (the provider used to force-disable caching for OAuth).
    # Caching never changes model outputs. Per-run kill-switch:
    # DEERFLOW_CLAUDE_PROMPT_CACHE=0 (restores the historical marker-free payload).
    enable_prompt_caching: true

  # === FALLBACK: Antigravity via Quotio (OpenAI-compatible local proxy) ===
  # Use with `--model antigravity` (deerflow_research.py) or set MiroFish's
  # DEERFLOW_MODEL=antigravity. Quotio exposes Antigravity through the local endpoint
  # configured by LLM_FALLBACK_BASE_URL/API_KEY.  The provider remains Antigravity;
  # ``gemini-3-flash-preview`` is Quotio's model alias.  Low reasoning effort is
  # explicit so fallback latency/cost stays bounded. PatchedChatOpenAI preserves
  # thought-signature values across multi-turn tool calls.
  - name: antigravity
    display_name: Gemini 3 Flash Preview (Antigravity/Quotio)
    use: deerflow.models.patched_openai:PatchedChatOpenAI
    model: gemini-3-flash-preview
    api_key: $LLM_FALLBACK_API_KEY
    base_url: $LLM_FALLBACK_BASE_URL
    reasoning_effort: low
    supports_reasoning_effort: true
    request_timeout: 900.0
    max_retries: 2
    # Gemini 3 Flash: 1,048,576 input / 65,536 output token limits. Long-form dossier +
    # tool-free synthesis report want the full output ceiling to avoid truncation.
    max_tokens: 65536
    context_window_tokens: 1048576
    supports_vision: false

  # === MiniMax code plan (api.minimaxi.com 国内版, OpenAI-compatible) ===
  # Use with `--model minimax` (deerflow_research.py) or set as MiroFish's
  # DEERFLOW_MODEL=minimax. Key comes from .env as $MINIMAX_API_KEY (sk-cp-… code-plan
  # key). MiniMax-M3 is a reasoning model that inlines its chain-of-thought into
  # `content` as <think>…</think>; the toggle below routes thinking → adaptive/disabled,
  # and deerflow_research.py strips any residual <think> from the final report.
  - name: minimax
    display_name: MiniMax-M3 (code plan)
    # PatchedChatMiniMax (a ChatOpenAI subclass) is REQUIRED here, not plain
    # langchain_openai:ChatOpenAI: (1) it strips the per-message `name` field that
    # DeerFlow middlewares inject (name="summary"/"loop_warning"/"todo_reminder"),
    # which otherwise triggers MiniMax's `400 user name must be consistent` (err 2013)
    # in multi-turn tool-calling — the root-cause fix, with tools + reasoning kept ON;
    # and (2) it preserves MiniMax's structured reasoning via extra_body.reasoning_split.
    use: deerflow.models.patched_minimax:PatchedChatMiniMax
    model: MiniMax-M3
    api_key: $MINIMAX_API_KEY
    base_url: https://api.minimaxi.com/v1
    request_timeout: 900.0
    max_retries: 2
    # MiniMax-M3: ~1M-token input context, 512K max output tokens. Thinking tokens
    # count against the output budget, and a deep dossier can be long, so set the
    # output ceiling to the model's full capability — this removes truncation as a
    # constraint; the model still emits only what it needs.
    max_tokens: 512000
    context_window_tokens: 1000000
    supports_vision: true
    supports_thinking: true
    when_thinking_enabled:
      extra_body:
        thinking:
          type: adaptive
    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled

  # === DeepSeek V4 (api.deepseek.com, OpenAI-style; 1M-token context) ===
  # Selected by MiroFish's provider=deepseek (DEERFLOW_MODEL=deepseek). Key comes
  # from .env as $DEEPSEEK_API_KEY. Uses the purpose-built PatchedChatDeepSeek
  # driver (subclasses langchain_deepseek.ChatDeepSeek) which replays
  # reasoning_content across multi-turn tool loops — required when thinking is on.
  # NOTE: ChatDeepSeek expects `api_base` + `timeout` (NOT base_url/request_timeout).
  # If `deepseek-v4-pro` is rejected by your account, change `model` to the id your
  # plan exposes (e.g. deepseek-chat / deepseek-reasoner / deepseek-v4-flash).
  - name: deepseek
    display_name: DeepSeek V4 Pro (Thinking)
    use: deerflow.models.patched_deepseek:PatchedChatDeepSeek
    model: deepseek-v4-pro
    api_key: $DEEPSEEK_API_KEY
    api_base: https://api.deepseek.com/v1
    timeout: 600.0
    max_retries: 2
    max_tokens: 64000
    context_window_tokens: 1000000
    supports_thinking: true
    supports_reasoning_effort: true
    supports_vision: false
    when_thinking_enabled:
      reasoning_effort: high
      extra_body:
        thinking:
          type: enabled
    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled

  # === Alibaba Qwen 3.7 Max (DashScope OpenAI-compatible; 1M-token context) ===
  # Selected by provider=qwen (DEERFLOW_MODEL=qwen). Key from .env as
  # $DASHSCOPE_API_KEY. International endpoint shown; CN users swap base_url to
  # https://dashscope.aliyuncs.com/compatible-mode/v1. DashScope toggles reasoning
  # via the non-standard extra_body.enable_thinking flag (text-only model).
  # Fallback model ids if qwen3.7-max is unavailable: qwen-plus / qwen-max-latest.
  # EXECPLAN2 I-8-4: qwen already carries BOTH when_thinking_enabled and
  # when_thinking_disabled blocks (DashScope toggles via the non-standard
  # enable_thinking flag), so the thinking budget is controlled in both the
  # research (thinking-on) and the parse-critical tool-free synthesis/extraction
  # (thinking-off) passes — at parity with deepseek/minimax for parse-stability.
  # Remaining cross-file follow-up (not config): a patched ChatOpenAI subclass
  # that replays reasoning_content across multi-turn tool loops (as
  # PatchedChatDeepSeek does) would further harden the agentic research turn.
  - name: qwen
    display_name: Qwen 3.7 Max
    use: langchain_openai:ChatOpenAI
    model: qwen3.7-max
    api_key: $DASHSCOPE_API_KEY
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 32768
    context_window_tokens: 1000000
    supports_thinking: true
    supports_vision: false
    when_thinking_enabled:
      extra_body:
        enable_thinking: true
    when_thinking_disabled:
      extra_body:
        enable_thinking: false

  # === Zhipu GLM (Z.ai / BigModel OpenAI-compatible; ~200K context) ===
  # Selected by provider=glm (DEERFLOW_MODEL=glm). Key from .env as $ZHIPUAI_API_KEY.
  # International endpoint shown; CN users swap base_url to
  # https://open.bigmodel.cn/api/paas/v4. GLM toggles reasoning via
  # extra_body.thinking.type. Default model glm-4.6; newer flagship is glm-5.1
  # (change `model` to glm-5.1 if your account has it).
  # EXECPLAN2 I-8-4: glm already carries BOTH when_thinking_enabled and
  # when_thinking_disabled blocks (toggled via extra_body.thinking.type, same
  # mechanism as deepseek), so reasoning is controlled in both the research
  # (thinking-on) and the parse-critical tool-free synthesis/extraction
  # (thinking-off) passes — at parity with deepseek/minimax for parse-stability.
  # Remaining cross-file follow-up (not config): a patched ChatOpenAI subclass
  # replaying reasoning_content across multi-turn tool loops would further harden
  # the agentic research turn (raw ChatOpenAI drops it between tool calls).
  - name: glm
    display_name: GLM-4.6 (Z.ai)
    use: langchain_openai:ChatOpenAI
    model: glm-5.3
    api_key: $ZHIPUAI_API_KEY
    base_url: https://open.bigmodel.cn/api/coding/paas/v4
    request_timeout: 600.0
    max_retries: 2
    max_tokens: 65536
    context_window_tokens: 200000
    supports_thinking: true
    supports_vision: false
    when_thinking_enabled:
      extra_body:
        thinking:
          type: enabled
    when_thinking_disabled:
      extra_body:
        thinking:
          type: disabled

  # === OpenAI Codex via ChatGPT subscription (NO API key) ===
  # Selected by provider=codex-cli (DEERFLOW_MODEL=codex). Credentials are loaded
  # from ~/.codex/auth.json (run `codex` and sign in with your ChatGPT account
  # first); override the path with $CODEX_AUTH_PATH. CodexChatModel posts to
  # chatgpt.com/backend-api/codex/responses internally, so there is NO api_key /
  # base_url / max_tokens here. The ChatGPT-plan endpoint rejects the `-codex`
  # suffix, so the model id is the bare `gpt-5.5` (matches the Codex CLI default).
  - name: codex
    display_name: GPT-5.5 (Codex / ChatGPT plan)
    use: deerflow.models.openai_codex_provider:CodexChatModel
    model: gpt-5.5
    reasoning_effort: high
    retry_max_attempts: 3
    supports_thinking: true
    supports_reasoning_effort: true
    supports_vision: false

  # === Kimi-for-coding (api.kimi.com/coding, OpenAI-compatible) ===
  # Selected by MiroFish's provider=kimi (DEERFLOW_MODEL=kimi). Key comes from .env
  # as $KIMI_API_KEY. The coding-plan gateway only serves recognized coding-agent
  # clients, hence the mandatory User-Agent header (same trick MiroFish's own kimi
  # provider uses). kimi-for-coding is a reasoning model; thinking stays ON for
  # research (deerflow_research.py strips residual <think> from the report).
  - name: kimi
    display_name: Kimi K2.7 (code plan)
    use: langchain_openai:ChatOpenAI
    model: kimi-k2.7
    api_key: $KIMI_API_KEY
    base_url: https://api.kimi.com/coding/v1
    default_headers:
      User-Agent: claude-cli/1.0.0
    request_timeout: 900.0
    max_retries: 2
    max_tokens: 32768
    context_window_tokens: 200000
    supports_thinking: true
    supports_vision: false
    # K2.7 Code gateway HARD-VALIDATES sampling temperature: it accepts ONLY
    # `1` when thinking is enabled and ONLY `0.6` when thinking is disabled —
    # any other value (including ChatOpenAI's default) is rejected with
    # `400 invalid_request_error: invalid temperature`. The temperature is set
    # inside each thinking block below so the research pass (thinking-on → 1) and
    # the tool-free synthesis/extraction pass (thinking-off → 0.6) each send the
    # single allowed value. (MiroFish's own kimi path enforces the same in
    # backend/app/utils/llm_client.py::_coerce_temperature.)
    # EXECPLAN2 I-8-4: provider parity with the patched reasoning stanzas
    # (minimax/deepseek). kimi-for-coding is a reasoning model, but this stanza
    # used the raw langchain_openai:ChatOpenAI with ONLY a when_thinking_disabled
    # block — so the research stage (DeerFlowClient thinking_enabled=True) left
    # reasoning at the gateway default (uncontrolled), while the parse-critical
    # tool-free synthesis/extraction passes (create_chat_model thinking_enabled=
    # False) hit when_thinking_disabled. Make BOTH toggle states explicit so the
    # thinking budget is controlled symmetrically with glm/deepseek and the
    # research output is as parse-stable as the report/sim (thinking-off) stage.
    when_thinking_enabled:
      temperature: 1.0      # gateway requires exactly 1 when thinking is on
      extra_body:
        thinking:
          type: enabled
    when_thinking_disabled:
      temperature: 0.6      # gateway requires exactly 0.6 when thinking is off
      extra_body:
        thinking:
          type: disabled

